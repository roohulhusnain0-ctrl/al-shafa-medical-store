<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al-Shafa Medical Store - Portal</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="container">
        <!-- Header / Logo Area -->
        <div class="brand-header">
            <i class="fa-solid fa-square-h brand-icon"></i>
            <h1>Al-Shafa Medical Store</h1>
            <p>Healthcare & Pharmacy Portal</p>
        </div>

        <!-- Toggle Buttons -->
        <div class="form-toggle">
            <button id="loginToggleBtn" class="toggle-btn active" onclick="showLogin()">Login</button>
            <button id="signupToggleBtn" class="toggle-btn" onclick="showSignup()">Sign Up</button>
        </div>

        <!-- LOGIN FORM -->
        <form id="loginForm" class="auth-form active-form">
            <h2>Welcome Back</h2>
            <div class="input-group">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" placeholder="Email Address" required>
            </div>
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" placeholder="Password" required>
            </div>
            <div class="form-options">
                <label><input type="checkbox"> Remember Me</label>
                <a href="#">Forgot Password?</a>
            </div>
            <button type="submit" class="submit-btn">Login</button>
        </form>

        <!-- SIGN UP FORM -->
        <form id="signupForm" class="auth-form">
            <h2>Create Account</h2>
            <div class="input-group">
                <i class="fa-solid fa-user"></i>
                <input type="text" placeholder="Full Name" required>
            </div>
            <div class="input-group">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" placeholder="Email Address" required>
            </div>
            <div class="input-group">
                <i class="fa-solid fa-phone"></i>
                <input type="tel" placeholder="Phone Number" required>
            </div>
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" placeholder="Password" required>
            </div>
            <button type="submit" class="submit-btn">Register</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
